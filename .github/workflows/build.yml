name: Build

on:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'fix/**'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      # No pnpm lockfile is committed yet; use the declared packageManager
      # rather than falling back to npm. Once pnpm-lock.yaml is generated,
      # switch this back to --frozen-lockfile.
      - run: pnpm install
      - run: pnpm run typecheck
      - run: pnpm run build
